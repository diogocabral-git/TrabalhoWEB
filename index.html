<!DOCTYPE html>
<!-- Página de entrada do site no GitHub Pages: o endereço principal abre este ficheiro e reencaminha para a página inicial verdadeira -->
<html lang="pt">
<head>
  <!-- Codificação dos caracteres, necessária para os acentos de "Secções" -->
  <meta charset="UTF-8">
  <!-- Ajusta a página ao ecrã em telemóveis -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Reencaminha logo (0 segundos) para a página inicial dentro da pasta Secções -->
  <meta http-equiv="refresh" content="0; url=Secções/inicio.html">
  <!-- Indica aos motores de busca qual é a página principal -->
  <link rel="canonical" href="Secções/inicio.html">
  <title>GaragemFácil</title>
</head>
<body>
  <!-- Ligação de recurso, caso o browser não faça o reencaminhamento automático -->
  <p>A abrir a página inicial… Se não abrir, <a href="Secções/inicio.html">clique aqui</a>.</p>

  <!-- Reencaminhamento por JavaScript, mais rápido e sem deixar esta página no histórico -->
  <script>
    window.location.replace("Secções/inicio.html");
  </script>
</body>
</html>
